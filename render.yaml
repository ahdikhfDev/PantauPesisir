services:
  - type: web
    name: pantaupesisir-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/system/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_API_KEY
        value: pantaupesisir-demo-2026
      - key: API_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://pantaupesisir.vercel.app
      - key: SIMULATOR_AUTOSTART
        value: "true"
      - key: SIMULATOR_ZONE_CODE
        value: ALL
      - key: ML_MODEL_VERSION
        value: cews-iforest-v1
      - key: SATELLITE_CACHE_DIR
        value: /tmp/satellite
